# Build and publish the four application images to GitHub Container Registry.
#
# This is the handoff path to an operator who deploys from images only, with no access to this
# repository: they `docker login ghcr.io` and pull the tag produced here. Postgres is not built
# — deployments use the official `postgres:16-alpine` or a managed instance.
#
# Nothing secret enters an image. Every credential (Mastercard keys, DB URL, shared tokens) is
# supplied as environment variables at container start, and the Mastercard key material is
# mounted as files — see deploy/DEPLOY.md.
name: Release images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. v1.0.0)'
        required: true
        type: string
      latest:
        description: 'Also move the :latest tag to this build'
        required: false
        default: true
        type: boolean
  push:
    tags: ['v*']

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # One failing component must not cancel the others: a partial release is easier to
      # reason about when you can see which image failed and which succeeded.
      fail-fast: false
      matrix:
        include:
          - name: gateway
            context: mastercard
          - name: mastercard-bff
            context: mastercard-bff
          - name: app-bff
            context: app-bff
          - name: frontend
            context: masrtercard-front
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tags
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME}"
            latest=true
          else
            version="${{ inputs.tag }}"
            latest="${{ inputs.latest }}"
          fi
          image="${REGISTRY}/${GITHUB_REPOSITORY}/${{ matrix.name }}"
          image="$(printf '%s' "$image" | tr '[:upper:]' '[:lower:]')"   # registry paths are lowercase
          tags="${image}:${version}"
          tags="${tags},${image}:sha-${GITHUB_SHA::7}"
          # An `if`, not `[ ... ] && ...`: the runner's shell is `bash -e`, where a false
          # test at statement level aborts the step.
          if [ "$latest" = "true" ]; then
            tags="${tags},${image}:latest"
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Uncomment together with `linux/arm64` below to publish multi-arch images (AWS Graviton).
      # Emulated arm64 builds are several times slower, so this stays off until it is needed.
      # - uses: docker/setup-qemu-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64 # ,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Ties a published image back to the exact commit it came from — the only link an
          # operator has, since they never see this repository.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.title=${{ matrix.name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Summary
        run: |
          echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
