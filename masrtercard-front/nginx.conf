server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # --- Security headers -------------------------------------------------------------------
  # Server-level so they also cover the /demo-api/* proxy locations (nginx inherits add_header
  # into a location only when that location declares none of its own; those declare only
  # proxy_set_header). `always` so they are emitted on error responses too.
  #
  # CSP ships as Report-Only FIRST. A CSP that blanks the SPA is the highest-probability
  # breakage in this change, so walk every page with devtools open, confirm a clean console,
  # and only then rename this header to Content-Security-Policy.
  #
  # Directive notes, because two of these look wrong and are not:
  #  - style-src 'unsafe-inline' is UNAVOIDABLE: Radix/react-remove-scroll inject <style> at
  #    runtime, and a nonce is impossible behind a statically-served build (try_files).
  #  - fonts.googleapis.com is required because the @import in index.css survives into the
  #    built CSS; fonts.gstatic.com serves the font files themselves.
  #  - frame-src is deliberately broad: the invoice viewer frames customer-supplied document
  #    URLs. The containment for that frame is its sandbox="" attribute, not this directive.
  #  - script-src stays 'self': the built index.html has no inline script. If a dynamic import
  #    is ever added, Vite emits an inline modulepreload polyfill and this would break the app.
  add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com https://upload.wikimedia.org; connect-src 'self'; frame-src https:; media-src 'none'; worker-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

  # The SPA calls the BFFs under /demo-api/* (VITE_DEMO_API_URL=/demo-api). nginx splits the
  # path between the two backends (same-origin for the browser, so no CORS). The trailing
  # slash on proxy_pass strips the matched prefix. Most specific location wins:
  #   /demo-api/xbs/*      + /demo-api/features/*  → mastercard-bff (cross-border layer)
  #   everything else under /demo-api/*            → app-bff       (entities/auth/integrations)

  # Cross-border (Mastercard) — the /xbs and /features API.
  location /demo-api/xbs/ {
    proxy_pass http://mastercard-bff:4000/xbs/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 5m;
  }
  location /demo-api/features/ {
    proxy_pass http://mastercard-bff:4000/features/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 5m;
  }

  # App data (entities / auth.me / integrations) — the permanent frontend backend.
  location /demo-api/ {
    proxy_pass http://app-bff:4000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 5m;
  }

  # Client-side routed SPA: fall back to index.html for unknown paths.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
